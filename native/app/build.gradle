plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.arilcihuyy.snscanner'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.arilcihuyy.snscanner'
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName '3.0.0'
        resConfigs 'id', 'en'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('SN_KEYSTORE') ?: '/home/ubuntu/.android-keys/warehouse-sn-scanner.keystore')
            storePassword System.getenv('SN_STOREPASS')
            keyAlias System.getenv('SN_KEYALIAS') ?: 'snscanner'
            keyPassword System.getenv('SN_KEYPASS')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    lint {
        abortOnError false
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
}
