<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>ROI decode test</title>
    <style>
      body { background: #07100b; color: #d9f7e5; font: 14px/1.6 ui-monospace, monospace; padding: 20px; }
      .pass { color: #3df08b; }
      .fail { color: #ff6b6b; }
      canvas { max-width: 100%; border: 1px solid #234; margin: 6px 0; }
    </style>
  </head>
  <body>
    <h1>ROI decode test</h1>
    <pre id="out">running…</pre>
    <canvas id="source"></canvas>
    <canvas id="crop"></canvas>
    <script src="../assets/zxing.min.js"></script>
    <script type="module">
      import { computeSourceRoi, createDecoder } from '../assets/scan-core.js';

      const out = document.getElementById('out');
      const source = document.getElementById('source');
      const crop = document.getElementById('crop');
      const sourceCtx = source.getContext('2d', { willReadFrequently: true });
      const cropCtx = crop.getContext('2d', { willReadFrequently: true });
      const decode = createDecoder(window.ZXing);
      const lines = [];
      let failed = 0;

      function check(name, actual, expected) {
        const ok = actual === expected;
        if (!ok) failed += 1;
        lines.push(`${ok ? 'PASS' : 'FAIL'} ${name}: ${JSON.stringify(actual)}`);
        console.log(ok ? 'PASS' : 'FAIL', name, actual);
      }

      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = reject;
          image.src = src;
        });
      }

      function cropAndDecode(roi) {
        crop.width = Math.round(roi.sw);
        crop.height = Math.round(roi.sh);
        cropCtx.imageSmoothingEnabled = true;
        cropCtx.imageSmoothingQuality = 'high';
        cropCtx.drawImage(
          source,
          roi.sx,
          roi.sy,
          roi.sw,
          roi.sh,
          0,
          0,
          crop.width,
          crop.height,
        );
        return decode(crop);
      }

      try {
        const sheet = await loadImage('fixtures/sheet.png');
        source.width = 1600;
        source.height = 900;
        sourceCtx.drawImage(sheet, 0, 0, 1600, 900);

        const exact = computeSourceRoi({
          videoWidth: 1600,
          videoHeight: 900,
          stageWidth: 800,
          stageHeight: 450,
          frame: { x: 60, y: 190, width: 680, height: 60 },
        });
        check('roi mirrors exact-aspect stage', JSON.stringify(exact), JSON.stringify({ sx: 120, sy: 380, sw: 1360, sh: 120 }));
        check('thin strip decodes only the middle barcode', cropAndDecode(exact), 'ZTEGC1234567');

        const cover = computeSourceRoi({
          videoWidth: 1600,
          videoHeight: 900,
          stageWidth: 400,
          stageHeight: 450,
          frame: { x: 20, y: 190, width: 360, height: 60 },
        });
        check('cover mapping source box', JSON.stringify(cover), JSON.stringify({ sx: 440, sy: 380, sw: 720, sh: 120 }));
        check('cover-mapped strip decodes target', cropAndDecode(cover), 'ZTEGC1234567');

        const gap = computeSourceRoi({
          videoWidth: 1600,
          videoHeight: 900,
          stageWidth: 800,
          stageHeight: 450,
          frame: { x: 60, y: 145, width: 680, height: 40 },
        });
        check('strip between labels finds nothing', cropAndDecode(gap), null);

        const qr = await loadImage('fixtures/qr.png');
        sourceCtx.fillStyle = '#fff';
        sourceCtx.fillRect(0, 0, 1600, 900);
        sourceCtx.drawImage(qr, (1600 - qr.width) / 2, (900 - qr.height) / 2);
        const qrRoi = computeSourceRoi({
          videoWidth: 1600,
          videoHeight: 900,
          stageWidth: 800,
          stageHeight: 450,
          frame: { x: 60, y: 159, width: 680, height: 132 },
        });
        check('QR inside the thin strip decodes', cropAndDecode(qrRoi), 'QR-TEST-0001');

        document.title = failed ? 'FAIL' : 'PASS';
      } catch (error) {
        failed += 1;
        lines.push(`ERROR ${error.message}`);
        document.title = 'FAIL';
      }

      lines.push(failed ? `${failed} failed` : 'all passed');
      out.textContent = lines.join('\n');
      out.className = failed ? 'fail' : 'pass';
      window.__result = { failed, lines };
    </script>
  </body>
</html>
